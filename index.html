<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kur'an İrab Akademisi - Pratik Modu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .word {
            font-size: 32px;
            color: #2c3e50;
            margin: 15px 0;
            font-weight: bold;
        }
        .meta {
            color: #7f8c8d;
            font-size: 14px;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-check { background-color: #27ae60; color: white; }
        .btn-next { background-color: #2980b9; color: white; }
        button:hover { opacity: 0.9; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f8f5;
            border-left: 5px solid #27ae60;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📖 Kur'an İrab Pratik Modu</h2>
    <div class="meta">
        <span>Sure No: <strong id="sura-no">-</strong></span> | 
        <span>Ayet No: <strong id="verse-no">-</strong></span>
    </div>

    <div class="word" id="word-display">Yükleniyor...</div>
    <div class="meta" id="diacritics-display"></div>

    <div class="btn-group">
        <button class="btn-check" onclick="showAnswer()">🔍 Kontrol Et</button>
        <button class="btn-next" onclick="nextWord()">➡️ Sonraki Kelime</button>
    </div>

    <div class="result" id="result-box">
        <h4>📊 Doğru İrab Verileri:</h4>
        <p><strong>Morfolojik Tür:</strong> <span id="morph-tag"></span></p>
        <p><strong>İrab Durumu / Hareke:</strong> <span id="case-mood"></span> (<span id="case-marker"></span>)</p>
        <p><strong>Cümledeki Görevi:</strong> <span id="syntactic-role"></span></p>
        <p><strong>Morfolojik Tip:</strong> <span id="morph-type"></span></p>
    </div>
</div>

<script>
    let masaqData = [];
    let currentItem = null;

    // JSON Verisini Yükle
    fetch('MASAQ.json')
        .then(response => response.json())
        .then(data => {
            masaqData = data;
            nextWord();
        })
        .catch(err => {
            document.getElementById('word-display').innerText = "MASAQ.json yüklenemedi!";
            console.error(err);
        });

    // Rastgele Kelime Seçme
    function nextWord() {
        if (masaqData.length === 0) return;
        
        document.getElementById('result-box').style.display = 'none';
        const randomIndex = Math.floor(Math.random() * masaqData.length);
        currentItem = masaqData[randomIndex];

        document.getElementById('sura-no').innerText = currentItem.Sura_No;
        document.getElementById('verse-no').innerText = currentItem.Verse_No;
        document.getElementById('word-display').innerText = currentItem.Word;
        document.getElementById('diacritics-display').innerText = `(${currentItem.Without_Diacritics})`;
    }

    // Cevabı Gösterme
    function showAnswer() {
        if (!currentItem) return;

        document.getElementById('morph-tag').innerText = currentItem.Morph_Tag || '-';
        document.getElementById('case-mood').innerText = currentItem.Case_Mood || '-';
        document.getElementById('case-marker').innerText = currentItem.Case_Mood_Marker || '-';
        document.getElementById('syntactic-role').innerText = currentItem.Syntactic_Role || '-';
        document.getElementById('morph-type').innerText = currentItem.Morph_Type || '-';

        document.getElementById('result-box').style.display = 'block';
    }
</script>

</body>
</html>
